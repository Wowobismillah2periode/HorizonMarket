<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="halaman.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Testimoni - Horizon Market</title>
</head>
<body>
    <div class="box-navbar">
        <nav>
            <!-- IKON HIASAN (shuriken) -->
            <img class="ikon ikon1" src="guest_png.png" alt="">
            <img class="ikon ikon2" src="gembok_png.png" alt="">
            <img class="ikon ikon3" src="roblox_png.png" alt="">
            <img class="ikon ikon4" src="rp_png.png" alt="">
            <img class="ikon ikon5" src="gembok_png.png" alt="">

            <!-- LOGO -->
            <div class="logo">
                <a href="index.html">
                    <img class="logo-jb" src="Logo_JB.png" alt="Horizon Market">
                </a>
            </div>

            <!-- MENU -->
            <ul class="box-stok-akun-testimoni">
                <!-- STOK AKUN (tetap) -->
                <li>
                    <a class="menu-link" href="stok_akun.html">
                        <svg class="ikon-menu folder" viewBox="0 0 32 32" aria-hidden="true">
                            <path class="folder-belakang" d="M2 8a2 2 0 0 1 2-2h7l3 3h12a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
                            <path class="folder-depan" d="M7 14.5h24l-3.6 12.2a1.5 1.5 0 0 1-1.44 1.1H3z"/>
                        </svg>
                        Stok Akun
                    </a>
                </li>

                <!-- BERANDA (menggantikan Testimoni) -->
                <li>
                    <a class="menu-link" href="index.html">
                        <span class="wrap-rumah">
                            <svg class="ikon-menu rumah" viewBox="0 0 32 32" aria-hidden="true">
                                <path class="atap" d="M3 15.5L16 4l13 11.5z"/>
                                <path class="dinding" d="M7 14h18v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/>
                                <rect class="ruang-pintu" x="13" y="18" width="6" height="10"/>
                                <rect class="pintu" x="13" y="18" width="6" height="10"/>
                            </svg>
                            <svg class="panah" viewBox="0 0 20 12" aria-hidden="true">
                                <path d="M19 6H3M7.5 1.5L3 6l4.5 4.5"/>
                            </svg>
                        </span>
                        Beranda
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!-- ISI HALAMAN: sementara kosong, fitur testimoni belum ditambahkan -->
    <main class="halaman halaman--tengah">
        <h1 class="sr-only">Testimoni</h1>
        <section class="kosong">
            <img src="kosong_fitur.png" alt="" width="324" height="294">
            <h2>Maaf, fitur yang kamu cari belum ditambahkan</h2>
            <p>Mohon coba lagi nanti saat fitur sudah ditambahkan</p>
        </section>
    </main>
</body>
</html>
